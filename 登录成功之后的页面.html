<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>欢迎回来</title>
    <style>
        /* 1. 与登录页完全一致的动态流光背景 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #a8edea 0%, #a8edea 35%, #fed6e3 65%, #fed6e3 100%);
            background-size: 200% 200%;
            transition: background-position 0.2s ease-out;
        }

        /* 2. 毛玻璃成功卡片 */
        .welcome-card {
            /* 半透明毛玻璃 */
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            width: 500px;
            padding: 50px 40px;
            border-radius: 24px;
            /* 高级光影边框 */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1),
            inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            text-align: center;

            /* 弹出入场动画 */
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* 3. 动态打勾图标（保留呼吸灯和画线动画） */
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #42e695 0%, #3bb2b8 100%);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(66, 230, 149, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(66, 230, 149, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(66, 230, 149, 0); }
            100% { box-shadow: 0 0 0 0 rgba(66, 230, 149, 0); }
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: white;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.6s 0.3s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        /* 4. 文字排版 */
        h1 {
            color: #333;
            font-size: 28px;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        p {
            color: #666; /* 稍微加深一点，在毛玻璃上更清晰 */
            font-size: 15px;
            margin: 0 0 35px 0;
        }

        /* 5. 底部按钮组 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden; /* 为扫光特效准备 */
        }

        /* 主按钮（绿色渐变扫光） */
        .btn-primary {
            background: linear-gradient(135deg, #42e695 0%, #3bb2b8 100%);
            color: #fff;
            box-shadow: 0 8px 15px rgba(66, 230, 149, 0.3);
        }

        /* 扫光动画伪元素 */
        .btn-primary::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(30deg);
            transition: all 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(66, 230, 149, 0.4);
        }
        .btn-primary:hover::after {
            left: 120%;
        }

        /* 次按钮（半透明玻璃质感） */
        .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            color: #555;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .btn-secondary:hover {
            background: #fff;
            color: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* 底部装饰 */
        .decor {
            margin-top: 30px;
            font-size: 40px;
            animation: float 3s ease-in-out infinite; /* 让小图标飘起来 */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="welcome-card">
    <!-- 动态打勾图标 -->
    <div class="success-icon">
        <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>

    <h1>登录成功！</h1>
    <p>欢迎回来，系统已为您准备就绪。</p>

    <div class="btn-group">
        <button class="btn-primary" onclick="alert('这里未来可以跳转到系统主功能页！')">进入系统</button>
        <button class="btn-secondary" onclick="logout()">退出登录</button>
    </div>

    <!-- 装饰元素 -->
    <div class="decor">🐱✨</div>
</div>

<script>
    // 1. 鼠标跟随流光背景（跟登录页完全一致）
    document.addEventListener('mousemove', function(e) {
        let x = e.clientX / window.innerWidth;
        let y = e.clientY / window.innerHeight;
        let bgX = (1 - x) * 100;
        let bgY = (1 - y) * 100;
        document.body.style.backgroundPosition = `${bgX}% ${bgY}%`;
    });

    // 2. 退出登录功能
    function logout() {
        window.location.href = "登录首页.html";
    }
</script>

</body>
</html>
